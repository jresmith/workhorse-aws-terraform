name: Infra CI (Terraform + Kubernetes)

on:
  pull_request:
    paths:
      - "terraform/**"
      - "gitops/**"
      - "policy/**"
  push:
    branches: ["main"]
    paths:
      - "terraform/**"
      - "gitops/**"
      - "policy/**"

env:
  TERRAFORM_DIR: terraform
  GITOPS_DIR: gitops
  KUBERNETES_VERSION: "1.29.0"

jobs:
  terraform-ci:
    name: Terraform validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Install Terraform tools (tflint, tfsec)
        run: |
          curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
          sudo mv tflint /usr/local/bin/tflint
          curl -sSL https://github.com/aquasecurity/tfsec/releases/latest/download/tfsec-linux-amd64 \
            -o tfsec
          sudo install tfsec /usr/local/bin/tfsec

      - name: Terraform fmt
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: terraform validate

      - name: TFLint
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: tflint --recursive

      - name: TFsec security scan
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: tfsec .

      - name: Terraform plan (no backend)
        working-directory: ${{ env.TERRAFORM_DIR }}
        env:
          TF_VAR_example: "ci"
        run: terraform plan -lock=false

  kubernetes-ci:
    name: Kubernetes validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Kubernetes tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip curl jq
          # yamllint
          sudo pip3 install yamllint
          # kubeconform
          KUBECONFORM_VERSION="v0.6.4"
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar xz -C /usr/local/bin
          # kustomize
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/latest/download/kustomize_linux_amd64.tar.gz" \
            | sudo tar xz -C /usr/local/bin
          # conftest
          curl -sSL https://github.com/open-policy-agent/conftest/releases/latest/download/conftest_linux_amd64.tar.gz \
            | sudo tar xz -C /usr/local/bin
          # kubectl
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl

      - name: YAML lint (raw manifests)
        run: |
          yamllint ${GITOPS_DIR}

      - name: Kustomize build + kubeconform (overlays)
        run: |
          set -e
          # Find all kustomization.yaml files under gitops and validate rendered output
          find "${GITOPS_DIR}" -name 'kustomization.yaml' -print0 | \
            xargs -0 -n1 -I{} sh -c '
              overlay_dir=$(dirname "{}")
              echo "Building Kustomize overlay: ${overlay_dir}"
              kustomize build "${overlay_dir}" > /tmp/rendered.yaml
              echo "Validating rendered overlay with kubeconform"
              kubeconform \
                -strict \
                -summary \
                -kubernetes-version "${KUBERNETES_VERSION}" \
                -output text \
                /tmp/rendered.yaml
            '

      - name: OPA policy checks (conftest)
        if: ${{ hashFiles('policy/**/*.rego') != '' }}
        run: |
          conftest test "${GITOPS_DIR}" \
            --policy policy \
            --output tap

      - name: Configure kubeconfig for dry-run
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG_CONTENT }}
        run: |
          mkdir -p "${HOME}/.kube"
          echo "$KUBECONFIG_CONTENT" | base64 -d > "${HOME}/.kube/config"
          chmod 600 "${HOME}/.kube/config"

      - name: Server-side dry-run (kubectl apply --dry-run=server)
        run: |
          # Dry-run all raw manifests (non-rendered) as an extra safety net
          find "${GITOPS_DIR}" -name '*.yaml' -print0 | \
            xargs -0 -n1 -I{} sh -c '
              echo "Dry-running {}"
              kubectl apply --dry-run=server -f "{}"
            '
