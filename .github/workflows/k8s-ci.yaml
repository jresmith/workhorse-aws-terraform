name: Kubernetes CI

on:
  pull_request:
    paths:
      - "workhorse/gitops/**"
  push:
    branches: ["main"]
    paths:
      - "workhorse/gitops/**"

env:
  KUBERNETES_VERSION: "1.30.0"

jobs:
  kubernetes-ci:
    name: Kubernetes validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Install Kubernetes tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip curl jq
          # yamllint
          sudo pip3 install yamllint
          # kubeconform
          KUBECONFORM_VERSION="v0.6.4"
          curl -L -o kubeconform.tar.gz \
          https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz
          sudo install kubeconform /usr/local/bin/

      - name: YAML lint (raw manifests)
        run: |
          yamllint -c .yamllint.yaml workhorse/gitops

      - name: Kustomize build + kubeconform (overlays)
        run: |
          set -e
          # Find all kustomization.yaml files under gitops and validate rendered output
          find workhorse/gitops -name 'kustomization.yaml' -print0 | xargs -0 -n1 -I{} sh -c '
              overlay_dir=$(dirname "{}")
              echo "Building Kustomize overlay: ${overlay_dir}"
              kustomize build --enable-helm "${overlay_dir}" > /tmp/rendered.yaml
              echo "Validating rendered overlay with kubeconform"
              kubeconform \
                -strict \
                -ignore-missing-schemas \
                -summary \
                -kubernetes-version "${KUBERNETES_VERSION}" \
                -output text \
                /tmp/rendered.yaml
          '
