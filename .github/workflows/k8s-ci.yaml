name: Kubernetes CI

on:
  pull_request:
    paths:
      - "workhorse/gitops/**"
  push:
    branches: ["main"]
    paths:
      - "workhorse/gitops/**"

env:
  KUBERNETES_VERSION: "1.30.0"

jobs:
  kubernetes-ci:
    name: Kubernetes validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.30.0

      - name: Install Kubernetes tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip curl jq
          # yamllint
          sudo pip3 install yamllint
          # kubeconform
          KUBECONFORM_VERSION="v0.6.4"
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | sudo tar xz -C /usr/local/bin
          # conftest
          curl -sSL https://github.com/open-policy-agent/conftest/releases/latest/download/conftest_linux_amd64.tar.gz | sudo tar xz -C /usr/local/bin

      - name: YAML lint (raw manifests)
        run: |
          yamllint workhorse/gitops

      - name: Kustomize build + kubeconform (overlays)
        run: |
          set -e
          # Find all kustomization.yaml files under gitops and validate rendered output
          find workhorse/gitops -name 'kustomization.yaml' -print0 | xargs -0 -n1 -I{} sh -c '
              overlay_dir=$(dirname "{}")
              echo "Building Kustomize overlay: ${overlay_dir}"
              kustomize build "${overlay_dir}" > /tmp/rendered.yaml
              echo "Validating rendered overlay with kubeconform"
              kubeconform \
                -strict \
                -summary \
                -kubernetes-version "${KUBERNETES_VERSION}" \
                -output text \
                /tmp/rendered.yaml
          '

      - name: Configure kubeconfig for dry-run
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG_CONTENT }}
        run: |
          mkdir -p "${HOME}/.kube"
          echo "$KUBECONFIG_CONTENT" | base64 -d > "${HOME}/.kube/config"
          chmod 600 "${HOME}/.kube/config"

      - name: Server-side dry-run (kubectl apply --dry-run=server)
        run: |
          # Dry-run all raw manifests (non-rendered) as an extra safety net
          find workhorse/gitops -name '*.yaml' -print0 | xargs -0 -n1 -I{} sh -c '
              echo "Dry-running {}"
              kubectl apply --dry-run=server -f "{}"
          '
