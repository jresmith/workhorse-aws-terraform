deploymentMode: SingleBinary

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 10Gi
    storageClass: standard

backend:
  replicas: 0

read:
  replicas: 0

write:
  replicas: 0

loki:
  auth_enabled: false

  server:
    log_level: info

  limits_config:
    ingestion_rate_mb: 4
    max_names_per_series: 10
    max_label_value_length: 2048

  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: boltdb-shipper
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

  storage:
    type: filesystem

  rulerConfig:
    storage:
      type: local
    rule_path: /rules
    alertmanagerurl: http://alertmanager.monitoring.svc.cluster.local:9093

serviceMonitor:
  enabled: false

podMonitor:
  enabled: false

grafana:
  enabled: false
  sidecar:
    datasources:
      enabled: true
      label: grafana_datasource

dashboards:
  enabled: true
  label: grafana_dashboard

ingress:
  enabled: false

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi
