---
# -----------------------------------------------------------------------------
# SECURITY NOTICE
#
# This Sealed Secrets private key is intentionally stored in Git to make this
# demonstration environment fully reproducible via GitOps. This allows ArgoCD
# to recreate clusters and continue decrypting previously sealed secrets.
#
# DO NOT use this approach in production.
#
# In production, the Sealed Secrets private key should be stored in a secure
# location such as:
#   - HashiCorp Vault
#   - AWS Secrets Manager
#   - Azure Key Vault
#   - GCP Secret Manager
#
# This file exists solely for educational and demonstration purposes.
# -----------------------------------------------------------------------------

apiVersion: v1
kind: Secret
metadata:
  name: sealed-secrets-key
  namespace: kube-system
  labels:
    sealedsecrets.bitnami.com/sealed-secrets-key: active
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
type: kubernetes.io/tls
data:
  tls.crt: 
  tls.key: 
