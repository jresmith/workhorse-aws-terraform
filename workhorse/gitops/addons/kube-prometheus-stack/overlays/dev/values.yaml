---
prometheus:
  enabled: true
  service:
    type: ClusterIP
  ingress:
    enabled: false
  prometheusSpec:
    ruleSelector:
      matchLabels:
        release: kube-prometheus-stack
    ruleNamespaceSelector:
      matchLabels:
        monitoring: enabled

grafana:
  enabled: true
  adminPassword: "admin"
  service:
    type: ClusterIP
  ingress:
    enabled: false
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
    datasources:
      enabled: true
      label: grafana_datasource

alertmanager:
  enabled: true
  service:
    type: ClusterIP
  ingress:
    enabled: false
  alertmanagerSpec:
    alertmanagerConfigSelector:
      matchLabels:
        release: kube-prometheus-stack
    alertmanagerConfigNamespaceSelector:
      matchLabels:
        monitoring: enabled

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true



