apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: alertmanager-routing-test-staging
  namespace: monitoring
  labels:
    release: kube-prometheus-stack

spec:
  groups:
    - name: receiver-tests
      rules:

        # STAGING

        - alert: StagingPlatformReceiverTest
          expr: vector(1)
          for: 1m
          labels:
            environment: staging
            alert_category: platform
            severity: info
          annotations:
            summary: Testing staging platform receiver

        - alert: StagingServiceReceiverTest
          expr: vector(1)
          for: 1m
          labels:
            environment: staging
            alert_category: service
            application: emojivoto
            severity: info
          annotations:
            summary: Testing staging service receiver

        - alert: StagingSLOReceiverTest
          expr: vector(1)
          for: 1m
          labels:
            environment: staging
            alert_category: slo
            application: emojivoto
            slo: request-availability
            severity: info
          annotations:
            summary: Testing staging SLO receiver

