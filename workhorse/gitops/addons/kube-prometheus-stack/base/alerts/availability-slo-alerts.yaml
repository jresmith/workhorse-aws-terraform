---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: emojivoto-availability-slo
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:

    - name: emojivoto.slo.burn-rate.long
      interval: 1m
      rules:
        # Calculate the 1-hour availability SLO burn rate.
        #
        # rate(response_total[1h])
        #   Converts the request counters into requests-per-second over the last hour.
        #
        # classification="failure"
        #   Selects only failed requests to calculate the failure rate.
        #
        # sum by (namespace)
        #   Aggregates all pods and replicas within each namespace into a single value.
        #
        # numerator
        #   Total failed request rate over the last hour.
        #
        # denominator
        #   Total request rate over the last hour.
        #
        # failure rate
        #   failed requests / total requests.
        #
        # clamp_min(..., 1e-9)
        #   Prevents divide-by-zero errors when request volume is zero.
        #
        # 1e-9
        #   A tiny number used as a safety guard when no traffic exists.
        #
        # / 0.001
        #   Converts the failure rate into a burn rate using the 99.9% SLO.
        #   A 99.9% SLO allows 0.1% failures, which equals 0.001.
        #
        # Example:
        #   0.1% failures = burn rate 1x
        #   1.0% failures = burn rate 10x
        #   10% failures = burn rate 100x
        #
        - record: emojivoto:slo_burn_rate:1h
          labels:
            application: emojivoto
            slo: request-availability
          expr: |
            (
              sum by (namespace) (
                rate(response_total{
                  namespace=~"emojivoto-.*",
                  deployment="web",
                  direction="inbound",
                  classification="failure"
                }[1h])
              )
              /
              clamp_min(
                sum by (namespace) (
                  rate(response_total{
                    namespace=~"emojivoto-.*",
                    deployment="web",
                    direction="inbound"
                  }[1h])
                ),
                1e-9
              )
            ) / 0.001
        # Same logic as the emojivoto:slo_burn_rate:1h above but over a 6 hour period instead
        - record: emojivoto:slo_burn_rate:6h
          labels:
            application: emojivoto
            slo: request-availability
          expr: |
            (
              sum by (namespace) (
                rate(response_total{
                  namespace=~"emojivoto-.*",
                  deployment="web",
                  direction="inbound",
                  classification="failure"
                }[6h])
              )
              /
              clamp_min(
                sum by (namespace) (
                  rate(response_total{
                    namespace=~"emojivoto-.*",
                    deployment="web",
                    direction="inbound"
                  }[6h])
                ),
                1e-9
              )
            ) / 0.001
        # Same logic as the emojivoto:slo_burn_rate:1h above but over a 24 hour period instead
        - record: emojivoto:slo_burn_rate:1d
          labels:
            application: emojivoto
            slo: request-availability
          expr: |
            (
              sum by (namespace) (
                rate(response_total{
                  namespace=~"emojivoto-.*",
                  deployment="web",
                  direction="inbound",
                  classification="failure"
                }[1d])
              )
              /
              clamp_min(
                sum by (namespace) (
                  rate(response_total{
                    namespace=~"emojivoto-.*",
                    deployment="web",
                    direction="inbound"
                  }[1d])
                ),
                1e-9
              )
            ) / 0.001
        # Same logic as the emojivoto:slo_burn_rate:1h above but over a 3 day period instead
        - record: emojivoto:slo_burn_rate:3d
          labels:
            application: emojivoto
            slo: request-availability
          expr: |
            (
              sum by (namespace) (
                rate(response_total{
                  namespace=~"emojivoto-.*",
                  deployment="web",
                  direction="inbound",
                  classification="failure"
                }[3d])
              )
              /
              clamp_min(
                sum by (namespace) (
                  rate(response_total{
                    namespace=~"emojivoto-.*",
                    deployment="web",
                    direction="inbound"
                  }[3d])
                ),
                1e-9
              )
            ) / 0.001

    - name: emojivoto.slo.burn-rate.short
      interval: 1m
      rules:
        # Same logic as the emojivoto:slo_burn_rate:1h above but over a 5 min period instead
        - record: emojivoto:slo_burn_rate:5m
          labels:
            application: emojivoto
            slo: request-availability
          expr: |
            (
              sum by (namespace) (
                rate(response_total{
                  namespace=~"emojivoto-.*",
                  deployment="web",
                  direction="inbound",
                  classification="failure"
                }[5m])
              )
              /
              clamp_min(
                sum by (namespace) (
                  rate(response_total{
                    namespace=~"emojivoto-.*",
                    deployment="web",
                    direction="inbound"
                  }[5m])
                ),
                1e-9
              )
            ) / 0.001
        # Same logic as the emojivoto:slo_burn_rate:1h above but over a 30 min period instead
        - record: emojivoto:slo_burn_rate:30m
          labels:
            application: emojivoto
            slo: request-availability
          expr: |
            (
              sum by (namespace) (
                rate(response_total{
                  namespace=~"emojivoto-.*",
                  deployment="web",
                  direction="inbound",
                  classification="failure"
                }[30m])
              )
              /
              clamp_min(
                sum by (namespace) (
                  rate(response_total{
                    namespace=~"emojivoto-.*",
                    deployment="web",
                    direction="inbound"
                  }[30m])
                ),
                1e-9
              )
            ) / 0.001
        # Same logic as the emojivoto:slo_burn_rate:1h above but over a 2 hour period instead
        - record: emojivoto:slo_burn_rate:2h
          labels:
            application: emojivoto
            slo: request-availability
          expr: |
            (
              sum by (namespace) (
                rate(response_total{
                  namespace=~"emojivoto-.*",
                  deployment="web",
                  direction="inbound",
                  classification="failure"
                }[2h])
              )
              /
              clamp_min(
                sum by (namespace) (
                  rate(response_total{
                    namespace=~"emojivoto-.*",
                    deployment="web",
                    direction="inbound"
                  }[2h])
                ),
                1e-9
              )
            ) / 0.001

    - name: emojivoto.slo.availability.alerts
      interval: 1m
      rules:
        # Alert when the error budget burn rate exceeds 720x over both the
        # 5-minute and 1-hour windows and remains above the threshold for 2 minutes.
        - alert: EmojivotoSLOBurnRateUrgent
          expr: |
            emojivoto:slo_burn_rate:1h{application="emojivoto"} > 720
            and on (namespace, slo)
            emojivoto:slo_burn_rate:5m{application="emojivoto"} > 720
          for: 2m
          labels:
            application: emojivoto
            severity: urgent
        # Alert when the error budget burn rate exceeds 30x over both the
        # 30-minute and 6-hour windows and remains above the threshold for 5 minutes.
        - alert: EmojivotoSLOBurnRateHigh
          expr: |
            emojivoto:slo_burn_rate:6h{application="emojivoto"} > 30
            and on (namespace, slo)
            emojivoto:slo_burn_rate:30m{application="emojivoto"} > 30
          for: 5m
          labels:
            application: emojivoto
            severity: high
        # Alert when the error budget burn rate exceeds 15x over both the
        # 2-hour and 1-day windows and remains above the threshold for 10 minutes.
        - alert: EmojivotoSLOBurnRateMedium
          expr: |
            emojivoto:slo_burn_rate:1d{application="emojivoto"} > 15
            and on (namespace, slo)
            emojivoto:slo_burn_rate:2h{application="emojivoto"} > 15
          for: 10m
          labels:
            application: emojivoto
            severity: medium
        # Alert when the error budget burn rate exceeds 7.5x over both the
        # 6-hour and 3-day windows and remains above the threshold for 15 minutes.
        - alert: EmojivotoSLOBurnRateLow
          expr: |
            emojivoto:slo_burn_rate:3d{application="emojivoto"} > 7.5
            and on (namespace, slo)
            emojivoto:slo_burn_rate:6h{application="emojivoto"} > 7.5
          for: 15m
          labels:
            application: emojivoto
            severity: low
