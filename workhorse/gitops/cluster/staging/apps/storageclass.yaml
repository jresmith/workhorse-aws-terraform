---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: storageclass
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://github.com/jresmith/workhorse-aws-terraform.git
    targetRevision: main
    path: workhorse/gitops/addons/storageclass/overlays/staging
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true