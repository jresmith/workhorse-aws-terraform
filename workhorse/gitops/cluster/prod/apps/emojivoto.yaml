---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: emojivoto-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jresmith/workhorse-aws-terraform.git
    path: workhorse/gitops/emojivoto/overlays/prod
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: emojivoto-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      enabled: true
    syncOptions:
      - CreateNamespace=true
