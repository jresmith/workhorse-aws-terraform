apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
data:
  resource.customizations: |
    v1/Service:
      health.lua: |
        hs = {}

        -- Only override in dev AND when annotation present
        if obj.metadata ~= nil and
           obj.metadata.namespace == "online-boutique-dev" and
           obj.metadata.annotations ~= nil and
           obj.metadata.annotations["argocd.ignore-health-check"] == "true" then
          hs.status = "Healthy"
          hs.message = "Ignoring LoadBalancer health (dev)"
          return hs
        end

        -- Default LB behavior
        if obj.spec ~= nil and obj.spec.type == "LoadBalancer" then
          if obj.status ~= nil and
             obj.status.loadBalancer ~= nil and
             obj.status.loadBalancer.ingress ~= nil then
            hs.status = "Healthy"
            return hs
          end

          hs.status = "Progressing"
          hs.message = "Waiting for LoadBalancer IP"
          return hs
        end

        hs.status = "Healthy"
        return hs