apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web
        image: ghcr.io/jresmith/emojivoto-web:v1
        imagePullPolicy: Always
        env:
        - name: WEB_PORT
          value: "8080"
        - name: EMOJISVC_HOST
          value: "emoji-svc:8080"
        - name: VOTINGSVC_HOST
          value: "voting-svc:8080"
        - name: INDEX_BUNDLE
          value: "dist/index_bundle.js"
        ports:
        - containerPort: 8080
