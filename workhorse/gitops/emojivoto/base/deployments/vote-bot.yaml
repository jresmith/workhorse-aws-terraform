---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vote-bot
  template:
    metadata:
      labels:
        app: vote-bot
    spec:
      containers:
        - name: vote-bot
          image: ghcr.io/jresmith/emojivoto-web:v1
          command:
            - emojivoto-vote-bot
          env:
            - name: WEB_HOST
              value: web:8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi